# Which Synty mesh stands for which food in the cooking module.
#
# Written by hand, then every id below was checked against Space Trucking's
# art catalogue (C:/Source/space-trucking/art/dex/*.toml) and every `food.*`
# table against `Food::ALL` in src/cooking/food.rs. It holds names, digests
# and English only, which is the same kind of thing that catalogue is; no
# mesh or texture is carried. See docs/SYNTY_COOKING.md for the reading.
#
#   id        "<pack>/<mesh>": the catalogue's own key. Unique across all 115
#             packs, because the same mesh name recurs between them.
#   source    where the mesh is inside the pack's Source Files download
#   sha256    digest of that source file, so a renamed or updated pack is noticed
#   fit       exact    it is the food
#             close    the right thing in a different form or state
#             stand-in a vessel or proxy; tint it, or fill it
#             gap      nothing fits; the nearest is named and needs composing
#   alts      other ids that could serve, best first; roles are in the doc
#
# To use one in Space Trucking's art pipeline, add the pack to its
# art/manifest.toml and paste `source` under an `[asset.<name>]` table.

